[project]
name = "ai-insurance-claims-processing-system"
version = "0.1.0"
description = "An AI-powered insurance claims processing system built with Python, FastAPI, and Large Language Models."
readme = "README.md"
authors = [
    { name = "Thubalethu Njapha", email = "thubzthubz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-insurance-claims-processing-system = "ai_insurance_claims_processing_system:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
